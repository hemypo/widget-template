<header class="cefalot-head cefalot-menu__head">
  <div class="cefalot-head__text">

    <p class="cefalot-lead">Выберите действие — нужная форма откроется прямо здесь.</p>
  </div>
  <button class="cefalot-close" type="button" data-widget-state-action="close" aria-label="Свернуть виджет"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true" focusable="false"><line x1="2" y1="2" x2="14" y2="14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><line x1="14" y1="2" x2="2" y2="14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
</header>

      <li><button class="cefalot-chip" type="button" data-widget-form="FORM_CALLBACK">Заказать звонок</button></li>
      <li><button class="cefalot-chip" type="button" data-widget-form="FORM_TEST_DRIVE">Тест-драйв</button></li>
      <li><button class="cefalot-chip" type="button" data-widget-form="FORM_TRADE_IN">Трейд-ин</button></li>
      <li><button class="cefalot-chip" type="button" data-widget-form="FORM_CREDIT">Рассчитать кредит</button></li>
      <li><button class="cefalot-chip" type="button" data-widget-form="FORM_OFFERS">Спецпредложения</button></li>
  </ul>
</nav>

</button>
