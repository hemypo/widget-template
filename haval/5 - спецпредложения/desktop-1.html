<div class="cefalot-layout">

  <!-- HERO SECTION -->
  <aside class="cefalot-hero"></aside>

  <!-- STEP PANEL -->
  <div class="cefalot-panel">

    <button class="cefalot-close" type="button" data-widget-close aria-label="Закрыть окно">
      <svg viewBox="0 0 16 16" fill="none" aria-hidden="true" focusable="false">
        <line x1="2" y1="2" x2="14" y2="14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        <line x1="14" y1="2" x2="2" y2="14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </button>

    <div class="cefalot-head">
      <span class="cefalot-eyebrow">Спецпредложения</span>
      <h2 class="cefalot-title">Выгодные условия на новый HAVAL</h2>
    </div>

    <div class="cefalot-body">

      <div class="cefalot-step-head">
        <p class="cefalot-step-eyebrow">Шаг 1 из 2</p>
        <h3 class="cefalot-step-title">Выберите предложение</h3>
        <p class="cefalot-step-lead">Выберите интересующий вариант — на следующем шаге оставьте контакты, и менеджер расскажет подробности.</p>
      </div>

      <div class="cefalot-offers-grid">

        <!-- 01 -->
        <label class="cefalot-offer-card">
          <input class="cefalot-offer-card__radio" type="radio" name="offer" value="Лучшие условия по Трейд-ин" data-widget-field="offer" required>
          <span class="cefalot-offer-card__surface">
            <span class="cefalot-offer-card__num">01</span>
            <span class="cefalot-offer-card__body">
              <span class="cefalot-offer-card__title">Лучшие условия по Трейд-ин</span>
              <span class="cefalot-eyebrow">с выгодой до 150 000 ₽</span>
            </span>
            <span class="cefalot-offer-card__check" aria-hidden="true">
              <svg viewBox="0 0 16 16" fill="none"><polyline points="3,8 6.5,11.5 13,4.5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </span>
          </span>
        </label>

        <!-- 02 -->
        <label class="cefalot-offer-card">
          <input class="cefalot-offer-card__radio" type="radio" name="offer" value="Выгодное страхование для клиентов" data-widget-field="offer" required>
          <span class="cefalot-offer-card__surface">
            <span class="cefalot-offer-card__num">02</span>
            <span class="cefalot-offer-card__body">
              <span class="cefalot-offer-card__title">При покупке этой осенью, дополнительное оборудование</span>
              <span class="cefalot-eyebrow">в подарок</span>
            </span>
            <span class="cefalot-offer-card__check" aria-hidden="true">
              <svg viewBox="0 0 16 16" fill="none"><polyline points="3,8 6.5,11.5 13,4.5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </span>
          </span>
        </label>

        <!-- 03 -->
        <label class="cefalot-offer-card">
          <input class="cefalot-offer-card__radio" type="radio" name="offer" value="Кредитная ставка 0,01%" data-widget-field="offer" required>
          <span class="cefalot-offer-card__surface">
            <span class="cefalot-offer-card__num">03</span>
            <span class="cefalot-offer-card__body">
              <span class="cefalot-offer-card__title">Кредитная ставка 0,01% <a class="cefalot-offer-card__asterisk" href="https://sales-haval-avtosalon-2000.ru/#popup:dslmr-payment" target="_blank" rel="noopener">*</a></span>
              <span class="cefalot-offer-card__list">
                <span class="cefalot-eyebrow">платеж от 4 880 ₽/мес</span>
</span>
            </span>
            <span class="cefalot-offer-card__check" aria-hidden="true">
              <svg viewBox="0 0 16 16" fill="none"><polyline points="3,8 6.5,11.5 13,4.5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </span>
          </span>
        </label>

        <!-- 04 -->
        <label class="cefalot-offer-card">
          <input class="cefalot-offer-card__radio" type="radio" name="offer" value="HAVAL по спеццене" data-widget-field="offer" required>
          <span class="cefalot-offer-card__surface">
            <span class="cefalot-offer-card__num">04</span>
            <span class="cefalot-offer-card__body">
              <span class="cefalot-offer-card__title">Только 7 HAVAL по спеццене</span>
              <span class="cefalot-eyebrow">от 1 949 000 ₽ до 30.09.2026</span>
            </span>
            <span class="cefalot-offer-card__check" aria-hidden="true">
              <svg viewBox="0 0 16 16" fill="none"><polyline points="3,8 6.5,11.5 13,4.5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </span>
          </span>
        </label>

      </div>
    </div>

    <footer class="cefalot-foot">
      <div class="cefalot-actions">
        <button class="cefalot-btn cefalot-btn--primary" type="button" data-widget-next>
          Далее
          <svg viewBox="0 0 20 12" fill="none" aria-hidden="true" focusable="false">
            <line x1="0" y1="6" x2="18" y2="6" stroke="currentColor" stroke-width="1.4"/>
            <polyline points="13,1 19,6 13,11" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
      <p class="cefalot-note">* Выберите одно предложение, чтобы продолжить.</p>
      <p class="cefalot-cr">Разработано в <a href="https://auto.makeagency.ru" target="_blank" rel="noopener">мэйк.диджитал</a></p>
    </footer>
  </div>

</div>
