<header class="cefalot-head">
  <div class="cefalot-head__text">
    <p class="cefalot-eyebrow">Шаг 2 из 2</p>
    <h2 class="cefalot-title">Запишитесь на тест-драйв</h2>
    <p class="cefalot-lead">Оставьте контактные данные — менеджер свяжется с вами и согласует удобное время тест-драйва.</p>
  </div>
  <button class="cefalot-close" type="button" data-widget-close aria-label="Закрыть окно"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true" focusable="false"><line x1="2" y1="2" x2="14" y2="14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><line x1="14" y1="2" x2="2" y2="14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
</header>

<div class="cefalot-body">

  <div class="cefalot-grid">

    <!-- NAME -->
    <div class="cefalot-field">
      <span class="cefalot-label" id="td-name-l-m">Имя<span class="cefalot-req" aria-hidden="true">*</span></span>
      <input class="cefalot-input" id="td-name-m" type="text" name="name" data-widget-field="name"
             placeholder="Введите имя" aria-labelledby="td-name-l-m" required aria-required="true">
    </div>

    <!-- PHONE -->
    <div class="cefalot-field">
      <span class="cefalot-label" id="td-phone-l-m">Телефон<span class="cefalot-req" aria-hidden="true">*</span></span>
      <input class="cefalot-input" id="td-phone-m" type="tel" name="phone"
             data-widget-field="phone" data-widget-field-type="phone" data-widget-mask="+7 (000) 000-00-00"
             placeholder="+7 (9XX) XXX-XX-XX" aria-labelledby="td-phone-l-m" inputmode="tel" required aria-required="true">
    </div>

  </div>

  <!-- CONSENTS -->
  <div class="cefalot-consents">

    <label class="cefalot-check">
      <input class="cefalot-check__box" type="checkbox" id="td-pd-m" name="agreement_pd"
             data-widget-field="agreement_pd" data-widget-field-type="checkbox" value="1" required aria-required="true">
      <span class="cefalot-check__text">Я даю согласие на <a class="cefalot-check__link" href="https://docs.yandex.ru/view/d/M7fLB9LZxYHXJ_iyHaU29iPegnqahzm72s0qoIz-cKg6R29aSkRmWVJTUQ" target="_blank" rel="noopener">обработку персональных данных</a><span class="cefalot-req">*</span></span>
    </label>

    <label class="cefalot-check">
      <input class="cefalot-check__box" type="checkbox" id="td-third-party-m" name="agreement_third_party"
             data-widget-field="agreement_third_party" data-widget-field-type="checkbox" value="1" required aria-required="true">
      <span class="cefalot-check__text">Я даю согласие на предоставление персональных данных третьим лицам; ознакомлен(-а) c <a class="cefalot-check__link" href="https://sales-haval-avtosalon-2000.ru/#popup:politika" target="_blank" rel="noopener">Политикой обработки персональных данных</a><span class="cefalot-req">*</span></span>
    </label>

  </div>

</div>

<footer class="cefalot-foot">
  <div class="cefalot-actions">
    <button class="cefalot-btn cefalot-btn--quiet" type="button" data-widget-back>
      <svg viewBox="0 0 20 12" fill="none" aria-hidden="true"><line x1="20" y1="6" x2="2" y2="6" stroke="currentColor" stroke-width="1.4"/><polyline points="7,1 1,6 7,11" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Назад
    </button>
    <button class="cefalot-btn cefalot-btn--primary" type="button" data-widget-submit>
      Записаться на тест-драйв
      <svg viewBox="0 0 20 12" fill="none" aria-hidden="true"><line x1="0" y1="6" x2="18" y2="6" stroke="currentColor" stroke-width="1.4"/><polyline points="13,1 19,6 13,11" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
  <p class="cefalot-note">* Поля, отмеченные звёздочкой, обязательны для заполнения.</p>
  <p class="cefalot-cr">Разработано в <a href="https://auto.makeagency.ru" target="_blank" rel="noopener">мэйк.диджитал</a></p>
</footer>
