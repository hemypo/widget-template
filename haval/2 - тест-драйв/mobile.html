<header class="cefalot-head">
  <div class="cefalot-head__text">
    <p class="cefalot-eyebrow">Тест-драйв</p>
    <h2 class="cefalot-title">Запись на тест-драйв HAVAL</h2>
    <p class="cefalot-lead">Оставьте контакты — менеджер подтвердит удобное время и модель для тест-драйва.</p>
  </div>
  <button class="cefalot-close" type="button" data-widget-close aria-label="Закрыть окно"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true" focusable="false"><line x1="2" y1="2" x2="14" y2="14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><line x1="14" y1="2" x2="2" y2="14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
</header>

<div class="cefalot-body">
  <div class="cefalot-grid">
    <div class="cefalot-field">
      <span class="cefalot-label" id="td-model-l">Модель<span class="cefalot-req" aria-hidden="true">*</span></span>
      <span class="cefalot-select-wrap">
        <select class="cefalot-select" id="td-model" name="model" data-widget-field="model" data-widget-field-type="select" aria-labelledby="td-model-l" required aria-required="true">
          <option value="" disabled selected>Выберите модель</option>
          <optgroup label="HAVAL CITY">
            <option value="m6">HAVAL M6</option>
            <option value="jolion">HAVAL Jolion</option>
            <option value="dargo">HAVAL Dargo</option>
            <option value="dargo_x">HAVAL Dargo X</option>
            <option value="f7">HAVAL F7</option>
            <option value="f7x">HAVAL F7x</option>
            <option value="poer">HAVAL Poer</option>
          </optgroup>
          <optgroup label="HAVAL PRO">
            <option value="h3">HAVAL H3</option>
            <option value="h5">HAVAL H5</option>
            <option value="h7">HAVAL H7</option>
            <option value="h9">HAVAL H9</option>
          </optgroup>
        </select>
        <span class="cefalot-caret" aria-hidden="true"><svg viewBox="0 0 12 12" fill="none" aria-hidden="true" focusable="false"><polyline points="2,4 6,8 10,4" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      </span>
    </div>

    <div class="cefalot-field">
      <span class="cefalot-label" id="td-name-l">Имя<span class="cefalot-req" aria-hidden="true">*</span></span>
      <input class="cefalot-input" id="td-name" type="text" name="name" data-widget-field="name"
             placeholder="Введите имя" aria-labelledby="td-name-l" required aria-required="true">
    </div>
    <div class="cefalot-field">
      <span class="cefalot-label" id="td-phone-l">Телефон<span class="cefalot-req" aria-hidden="true">*</span></span>
      <input class="cefalot-input" id="td-phone" type="tel" name="phone"
             data-widget-field="phone" data-widget-field-type="phone" data-widget-mask="+7 (000) 000-00-00"
             placeholder="+7 (9XX) XXX-XX-XX" aria-labelledby="td-phone-l" required aria-required="true" inputmode="tel">
    </div>
    <div class="cefalot-field">
      <span class="cefalot-label" id="td-date-l">Удобная дата</span>
      <input class="cefalot-input" id="td-date" type="date" name="preferred_date"
             data-widget-field="preferred_date" data-widget-field-type="date" aria-labelledby="td-date-l">
    </div>
  </div>

  <div class="cefalot-consents">
    <label class="cefalot-check">
      <input class="cefalot-check__box" type="checkbox" id="td-pd" name="agreement_pd"
             data-widget-field="agreement_pd" data-widget-field-type="checkbox" value="1" required aria-required="true">
      <span class="cefalot-check__text">Согласен(на) с условиями обработки персональных данных согласно
        <a class="cefalot-check__link" href="https://www.haval.ru/" target="_blank" rel="noopener">политике конфиденциальности</a><span class="cefalot-req" aria-hidden="true">*</span></span>
    </label>
  </div>
</div>

<footer class="cefalot-foot">
  <div class="cefalot-actions">
    <button class="cefalot-btn cefalot-btn--primary" type="button" data-widget-submit>Записаться <svg viewBox="0 0 20 12" fill="none" aria-hidden="true" focusable="false"><line x1="0" y1="6" x2="18" y2="6" stroke="currentColor" stroke-width="1.4"/><polyline points="13,1 19,6 13,11" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="cefalot-btn cefalot-btn--quiet" type="button" data-widget-close>Отмена</button>
  </div>
  <p class="cefalot-note">* Поля, отмеченные звёздочкой, обязательны для заполнения.</p>
  <p class="cefalot-cr">Разработано в <a href="https://auto.makeagency.ru" target="_blank">мэйк.диджитал</a></p>
</footer>
