<button
  class="cefalot-launcher__dismiss"
  type="button"
  data-widget-hide-visit
  aria-label="Не показывать сегодня"
>
  <svg viewBox="0 0 12 12" fill="none" aria-hidden="true" focusable="false">
    <line
      x1="1.5"
      y1="1.5"
      x2="10.5"
      y2="10.5"
      stroke="currentColor"
      stroke-width="1.4"
      stroke-linecap="round"
    />
    <line
      x1="10.5"
      y1="1.5"
      x2="1.5"
      y2="10.5"
      stroke="currentColor"
      stroke-width="1.4"
      stroke-linecap="round"
    />
  </svg>
</button>

<div class="cefalot-launcher">

  <button
    class="cefalot-launcher__btn"
    type="button"
    data-widget-state-action="open"
    aria-label="Открыть меню JAECOO — выбрать нужный раздел"
  >
    <span class="cefalot-launcher__icon" aria-hidden="true">

      <svg
        class="cefalot-launcher__grid"
        viewBox="0 0 21 20"
        fill="none"
        aria-hidden="true"
        focusable="false"
      >
        <rect
          class="cefalot-launcher__grid-cell cefalot-launcher__grid-cell--1"
          x="0"
          y="0"
          width="9.45"
          height="9"
          rx="3"
          fill="currentColor"
        />

        <rect
          class="cefalot-launcher__grid-cell cefalot-launcher__grid-cell--2"
          x="11.55"
          y="0"
          width="9.45"
          height="9"
          rx="3"
          fill="currentColor"
        />

        <rect
          class="cefalot-launcher__grid-cell cefalot-launcher__grid-cell--3"
          x="0"
          y="11"
          width="9.45"
          height="9"
          rx="3"
          fill="currentColor"
        />

        <rect
          class="cefalot-launcher__grid-cell cefalot-launcher__grid-cell--4"
          x="11.55"
          y="11"
          width="9.45"
          height="9"
          rx="3"
          fill="currentColor"
        />
      </svg>

    </span>
  </button>
</div>
