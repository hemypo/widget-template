<button
  class="cefalot-launcher__dismiss"
  type="button"
  data-widget-hide-visit
  aria-label="Не показывать сегодня"
>
  <svg viewBox="0 0 12 12" fill="none" aria-hidden="true" focusable="false">
    <line
      x1="1.5"
      y1="1.5"
      x2="10.5"
      y2="10.5"
      stroke="currentColor"
      stroke-width="1.4"
      stroke-linecap="round"
    />
    <line
      x1="10.5"
      y1="1.5"
      x2="1.5"
      y2="10.5"
      stroke="currentColor"
      stroke-width="1.4"
      stroke-linecap="round"
    />
  </svg>
</button>

<button
  class="cefalot-launcher__btn"
  type="button"
  data-widget-state-action="open"
  aria-label="Открыть меню CHANGAN — выбрать нужный раздел"
>
  <span class="cefalot-launcher__icon" aria-hidden="true">

    <svg
      class="cefalot-launcher__wheel"
      viewBox="0 0 24 24"
      fill="none"
      aria-hidden="true"
      focusable="false"
    >
      <circle
        class="cefalot-launcher__wheel-rim"
        cx="12"
        cy="12"
        r="8.6"
        stroke="currentColor"
        stroke-width="1.7"
      />

      <circle
        class="cefalot-launcher__wheel-hub"
        cx="12"
        cy="12"
        r="2.3"
        fill="currentColor"
      />

      <line
        class="cefalot-launcher__wheel-spoke cefalot-launcher__wheel-spoke--1"
        x1="12"
        y1="3.6"
        x2="12"
        y2="7.4"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
      />

      <line
        class="cefalot-launcher__wheel-spoke cefalot-launcher__wheel-spoke--2"
        x1="5.1"
        y1="16.2"
        x2="8.3"
        y2="14.1"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
      />

      <line
        class="cefalot-launcher__wheel-spoke cefalot-launcher__wheel-spoke--3"
        x1="18.9"
        y1="16.2"
        x2="15.7"
        y2="14.1"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
      />
    </svg>

  </span>
</button>
