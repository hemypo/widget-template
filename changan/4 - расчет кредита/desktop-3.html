<div class="cefalot-layout">

  <!-- HERO SECTION -->
  <aside class="cefalot-hero"></aside>

  <!-- FORM PANEL -->
  <div class="cefalot-panel">

    <!-- Крестик закрытия (строго на своем месте) -->
    <button class="cefalot-close" type="button" data-widget-close aria-label="Закрыть окно">
      <svg viewBox="0 0 16 16" fill="none" aria-hidden="true" focusable="false">
        <line x1="2" y1="2" x2="14" y2="14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        <line x1="14" y1="2" x2="2" y2="14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </button>

    <div class="cefalot-head">
      <span class="cefalot-eyebrow">Кредитная программа</span>
      <h2 class="cefalot-title">Рассчитать кредит</h2>
      <p class="cefalot-lead">Подберём выгодные условия кредита от банков-партнёров CHANGAN — низкий % и высокий % одобрения.</p>
    </div>

    <div class="cefalot-step-head">
      <span class="cefalot-step-eyebrow">Шаг 3 из 3</span>
      <h3 class="cefalot-step-title">Контакты</h3>
    </div>

    <div class="cefalot-body">
      <div class="cefalot-grid">
        <div class="cefalot-field">
          <span class="cefalot-label" id="cr-name-l">Имя<span class="cefalot-req" aria-hidden="true">*</span></span>
          <input class="cefalot-input" type="text" name="name" data-widget-field="name" placeholder="Введите имя" aria-labelledby="cr-name-l" required aria-required="true">
        </div>
        <div class="cefalot-field">
          <span class="cefalot-label" id="cr-phone-l">Телефон<span class="cefalot-req" aria-hidden="true">*</span></span>
          <input class="cefalot-input" type="tel" name="phone" data-widget-field="phone" data-widget-field-type="phone" placeholder="+7 (9XX) XXX-XX-XX" aria-labelledby="cr-phone-l" inputmode="tel" required aria-required="true">
        </div>
      </div>

      <div class="cefalot-consents">
        <label class="cefalot-check">
          <input class="cefalot-check__box" type="checkbox" name="agreement_pd" data-widget-field="agreement_pd" data-widget-field-type="checkbox" value="1" required aria-required="true">
          <span class="cefalot-check__text">
            Я даю <a class="cefalot-check__link" href="https://changanauto.ru/about-us/legal-information/consent-personal-data" target="_blank" rel="noopener">согласие на обработку персональных данных</a>
            <span class="cefalot-req" aria-hidden="true">*</span>
          </span>
        </label>
        <label class="cefalot-check">
          <input class="cefalot-check__box" type="checkbox" name="agreement_third_party" data-widget-field="agreement_third_party" data-widget-field-type="checkbox" value="1" required aria-required="true">
          <span class="cefalot-check__text">
            Я даю согласие на <a class="cefalot-check__link" href="https://changanauto.ru/about-us/legal-information/privacy-policy" target="_blank" rel="noopener">предоставление персональных данных третьим лицам</a> и ознакомлен(-а) с <a class="cefalot-check__link" href="https://changanauto.ru/about-us/legal-information/personal-data-policy" target="_blank" rel="noopener">Политикой обработки персональных данных</a>
            <span class="cefalot-req" aria-hidden="true">*</span>
          </span>
        </label>
      </div>
    </div>

    <footer class="cefalot-foot">
      <div class="cefalot-actions">
        <button class="cefalot-btn cefalot-btn--ghost" type="button" data-widget-back>
          <svg viewBox="0 0 20 12" fill="none" aria-hidden="true" focusable="false"><line x1="20" y1="6" x2="2" y2="6" stroke="currentColor" stroke-width="1.4"/><polyline points="7,1 1,6 7,11" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Назад
        </button>
        <button class="cefalot-btn cefalot-btn--primary" type="button" data-widget-submit>
          Отправить заявку
          <svg viewBox="0 0 20 12" fill="none" aria-hidden="true" focusable="false"><line x1="0" y1="6" x2="18" y2="6" stroke="currentColor" stroke-width="1.4"/><polyline points="13,1 19,6 13,11" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <p class="cefalot-note">* Поля, отмеченные звёздочкой, обязательны для заполнения.</p>
      <p class="cefalot-cr">Разработано в <a href="https://auto.makeagency.ru" target="_blank" rel="noopener">мэйк.диджитал</a></p>
    </footer>
  </div>

</div>
