<div class="cefalot-layout">

  <!-- HERO SECTION -->
  <aside class="cefalot-hero"></aside>

  <!-- FORM PANEL -->
  <div class="cefalot-panel">

    <!-- Крестик закрытия (строго на своем месте) -->
    <button class="cefalot-close" type="button" data-widget-close aria-label="Закрыть окно">
      <svg viewBox="0 0 16 16" fill="none" aria-hidden="true" focusable="false">
        <line x1="2" y1="2" x2="14" y2="14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        <line x1="14" y1="2" x2="2" y2="14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </button>

    <div class="cefalot-head">
      <span class="cefalot-eyebrow">Кредитная программа</span>
      <h2 class="cefalot-title">Рассчитать кредит</h2>
      <p class="cefalot-lead">Подберём выгодные условия кредита от банков-партнёров CHANGAN — низкий % и высокий % одобрения.</p>
    </div>

    <div class="cefalot-step-head">
      <span class="cefalot-step-eyebrow">Шаг 1 из 3</span>
      <h3 class="cefalot-step-title">Выберите модель</h3>
    </div>

    <div class="cefalot-body">
      <div class="cefalot-field">
        <span class="cefalot-label" id="cr-model-l">Модель<span class="cefalot-req" aria-hidden="true">*</span></span>
        <span class="cefalot-select-wrap">
          <select class="cefalot-select" name="model" data-widget-field="model" data-widget-field-type="select" aria-labelledby="cr-model-l" required aria-required="true">
            <option value="" disabled selected>Выберите модель</option>
            <option value="cs75-pro">CHANGAN CS75 PRO</option>
            <option value="alsvin">CHANGAN ALSVIN</option>
            <option value="cs35-plus">CHANGAN CS35 PLUS</option>
            <option value="cs35-max">CHANGAN CS35 MAX</option>
            <option value="cs75-plus">CHANGAN CS75 PLUS</option>
            <option value="cs75-plus-new">CHANGAN CS75 PLUS NEW</option>
            <option value="cs95-new">CHANGAN CS95 NEW</option>
            <option value="hunter-plus">CHANGAN HUNTER PLUS</option>
            <option value="uni-k">CHANGAN UNI-K</option>
            <option value="uni-s">CHANGAN UNI-S</option>
            <option value="uni-t">CHANGAN UNI-T</option>
            <option value="uni-v">CHANGAN UNI-V</option>
            <option value="uni-v-2-0t">CHANGAN UNI-V 2.0T</option>
            <option value="uni-s-4x4">CHANGAN UNI-S 4X4</option>
            <option value="deepal-g318">DEEPAL G318</option>
            <option value="deepal-s07">DEEPAL S07</option>
          </select>
          <span class="cefalot-caret" aria-hidden="true">
            <svg viewBox="0 0 12 12" fill="none"><polyline points="2,4 6,8 10,4" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
        </span>
      </div>
    </div>

    <footer class="cefalot-foot">
      <div class="cefalot-actions">
        <button class="cefalot-btn cefalot-btn--primary" type="button" data-widget-next>
          Далее
          <svg viewBox="0 0 20 12" fill="none" aria-hidden="true" focusable="false">
            <line x1="0" y1="6" x2="18" y2="6" stroke="currentColor" stroke-width="1.4"/>
            <polyline points="13,1 19,6 13,11" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
      <p class="cefalot-note">* Поля, отмеченные звёздочкой, обязательны для заполнения.</p>
      <p class="cefalot-cr">Разработано в <a href="https://auto.makeagency.ru" target="_blank" rel="noopener">мэйк.диджитал</a></p>
    </footer>
  </div>

</div>
