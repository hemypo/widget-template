<header class="cefalot-head">
  <div class="cefalot-head__text">
    <p class="cefalot-eyebrow">Обратная связь</p>
    <h2 class="cefalot-title">Закажите обратный звонок</h2>
    <p class="cefalot-lead">Оставьте номер — менеджер дилерского центра Changan перезвонит в течение 15 минут в рабочее время.</p>
  </div>
  <button class="cefalot-close" type="button" data-widget-close aria-label="Закрыть окно"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true" focusable="false"><line x1="2" y1="2" x2="14" y2="14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><line x1="14" y1="2" x2="2" y2="14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
</header>

<div class="cefalot-body">
  <div class="cefalot-grid">
    <div class="cefalot-field">
      <span class="cefalot-label" id="cb-name-l">Имя<span class="cefalot-req" aria-hidden="true">*</span></span>
      <input class="cefalot-input" id="cb-name" type="text" name="name" data-widget-field="name"
             placeholder="Введите имя" aria-labelledby="cb-name-l" required aria-required="true">
    </div>
    <div class="cefalot-field">
      <span class="cefalot-label" id="cb-phone-l">Телефон<span class="cefalot-req" aria-hidden="true">*</span></span>
      <input class="cefalot-input" id="cb-phone" type="tel" name="phone"
             data-widget-field="phone" data-widget-field-type="phone" data-widget-mask="+7 (000) 000-00-00"
             placeholder="+7 (9XX) XXX-XX-XX" aria-labelledby="cb-phone-l" required aria-required="true" inputmode="tel">
    </div>
  </div>

  <div class="cefalot-consents">
    <label class="cefalot-check">
      <input class="cefalot-check__box" type="checkbox" id="cb-pd" name="agreement_pd"
             data-widget-field="agreement_pd" data-widget-field-type="checkbox" value="1" required aria-required="true">
      <span class="cefalot-check__text">Я даю <a class="cefalot-check__link" href="https://changanauto.ru/about-us/legal-information/consent-personal-data" target="_blank" rel="noopener">согласие на обработку персональных данных</a><span class="cefalot-req" aria-hidden="true">*</span></span>
    </label>

    <label class="cefalot-check">
      <input class="cefalot-check__box" type="checkbox" id="cb-third-party" name="agreement_third_party"
             data-widget-field="agreement_third_party" data-widget-field-type="checkbox" value="1" required aria-required="true">
      <span class="cefalot-check__text">Я согласен(-на) с условиями <a class="cefalot-check__link" href="https://changanauto.ru/about-us/legal-information/personal-data-policy" target="_blank" rel="noopener">Политики обработки персональных данных</a> и <a class="cefalot-check__link" href="https://changanauto.ru/about-us/legal-information/privacy-policy" target="_blank" rel="noopener">Политикой конфиденциальности</a><span class="cefalot-req" aria-hidden="true">*</span></span>
    </label>
  </div>
</div>

<footer class="cefalot-foot">
  <div class="cefalot-actions">
    <button class="cefalot-btn cefalot-btn--primary" type="button" data-widget-submit>Заказать звонок <svg viewBox="0 0 20 12" fill="none" aria-hidden="true" focusable="false"><line x1="0" y1="6" x2="18" y2="6" stroke="currentColor" stroke-width="1.4"/><polyline points="13,1 19,6 13,11" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="cefalot-btn cefalot-btn--quiet" type="button" data-widget-close>Отмена</button>
  </div>
  <p class="cefalot-note">* Поля, отмеченные звёздочкой, обязательны для заполнения.</p>
  <p class="cefalot-cr">Разработано в <a href="https://auto.makeagency.ru" target="_blank">мэйк.диджитал</a></p>
</footer>
