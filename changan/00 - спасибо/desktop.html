<header class="cefalot-head">
  <div class="cefalot-head__text"></div>
  <button class="cefalot-close" type="button" data-widget-close aria-label="Закрыть окно">
    <svg viewBox="0 0 16 16" fill="none" aria-hidden="true" focusable="false"><line x1="2" y1="2" x2="14" y2="14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><line x1="14" y1="2" x2="2" y2="14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
  </button>
</header>

<div class="cefalot-success">
  <span class="cefalot-success__icon" aria-hidden="true">
    <svg viewBox="0 0 32 32" fill="none" aria-hidden="true" focusable="false"><circle cx="16" cy="16" r="15" stroke="currentColor" stroke-width="1.6"/><polyline points="9,16.5 14,21.5 23,11" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </span>
  <h2 class="cefalot-success__title">Спасибо, заявка принята!</h2>
  <p class="cefalot-success__lead">Мы получили вашу заявку. Менеджер Changan свяжется с вами в ближайшее время, чтобы обсудить детали.</p>

  <div class="cefalot-actions cefalot-success__actions">
    <button class="cefalot-btn cefalot-btn--ghost" type="button" data-widget-close>Закрыть</button>
  </div>
</div>
