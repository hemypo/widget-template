<header class="cefalot-head">
  <button class="cefalot-close" type="button" data-widget-close aria-label="Закрыть окно">
      <svg viewBox="0 0 16 16" fill="none" aria-hidden="true" focusable="false">
        <line x1="2" y1="2" x2="14" y2="14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        <line x1="14" y1="2" x2="2" y2="14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
  </button>
</header>

<div class="cefalot-success">
  <div class="cefalot-success__icon-wrap">
    <span class="cefalot-success__icon" aria-hidden="true">
      <svg viewBox="0 0 32 32" fill="none" aria-hidden="true" focusable="false">
        <circle cx="16" cy="16" r="15" stroke="currentColor" stroke-width="1.4" class="cefalot-success__circle"/>
        <polyline points="9,16.5 14,21.5 23,11" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" class="cefalot-success__check"/>
      </svg>
    </span>
    <div class="cefalot-success__ripple"></div>
  </div>

  <h2 class="cefalot-title">Заявка отправлена</h2>
  <p class="cefalot-lead">Мы свяжемся с вами в ближайшее время и уточним детали.</p>

  <div class="cefalot-actions cefalot-success__actions">
    <button class="cefalot-btn cefalot-btn--primary" type="button" data-widget-close>Закрыть окно</button>
  </div>
</div>

<footer class="cefalot-foot">
  <p class="cefalot-cr">Разработано в <a href="https://auto.makeagency.ru" target="_blank">мэйк.диджитал</a></p>
</footer>
